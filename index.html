<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Gotcha — Free Peer Consultation Marketplace</title>
    <meta name="title"       content="Gotcha — Free Peer Consultation Marketplace" />
    <meta name="description" content="Find free consultants for your exact university course. Book sessions in seconds. CSE, EEE, MAT, ENG, LAW and 500+ more course codes. No fees, ever." />
    <meta name="keywords"    content="free consultation, university help, peer tutoring, CSE tutor, find consultant, gotcha, study help, course help, book session, online tutoring" />
    <meta name="robots"      content="index, follow" />
    <meta name="author"      content="Gotcha" />
    <link rel="canonical"    href="https://gotcha.vercel.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://gotcha.vercel.app" />
    <meta property="og:title"       content="Gotcha — Find Someone Who Can Help" />
    <meta property="og:description" content="Free peer-to-peer consultation marketplace. Book expert students for CSE, EEE, MAT, LAW and 500+ courses. No fees, no credit card." />
    <meta property="og:image"       content="https://gotcha.vercel.app/og-image.png" />
    <meta property="og:site_name"   content="Gotcha" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://gotcha.vercel.app" />
    <meta name="twitter:title"       content="Gotcha — Free Peer Consultation" />
    <meta name="twitter:description" content="Find free consultants for your exact university course. 500+ courses supported. Book in under 2 minutes." />
    <meta name="twitter:image"       content="https://gotcha.vercel.app/og-image.png" />

    <!-- Favicon (G. logo as SVG) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon"          href="/favicon.svg" />

    <!-- Performance: preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Gotcha",
      "description": "Free peer-to-peer consultation marketplace for university students",
      "url": "https://gotcha.vercel.app",
      "applicationCategory": "EducationApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#FFD93D" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
